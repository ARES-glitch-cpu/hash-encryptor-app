name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Pre-accept Android SDK licenses
      run: |
        # Создаем папки для лицензий в глобальной конфигурации и в папке Buildozer
        mkdir -p $HOME/.android
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        
        # Записываем криптографические хеши принятых лицензий (обходит запрос y/N)
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.android/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/.android/android-sdk-preview-license
        
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Build APK with Buildozer
      run: buildozer android debug
      env:
        # Указываем пути, чтобы Buildozer использовал подготовленные лицензии
        ANDROID_HOME: $HOME/.buildozer/android/platform/android-sdk
        ANDROID_SDK_ROOT: $HOME/.buildozer/android/platform/android-sdk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: HashEncryptor-APK
        path: bin/*.apk
