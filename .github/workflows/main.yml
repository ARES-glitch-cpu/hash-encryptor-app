name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Pre-accept Android licenses
      run: |
        # Создаем папки для лицензий
        mkdir -p $HOME/.android
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        # Записываем хеши принятых лицензий, чтобы Buildozer не задавал вопросов
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.android/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/.android/android-sdk-preview-license
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Build APK with Buildozer
      run: buildozer android debug
      env:
        # Указываем Buildozer использовать скачанный им же SDK
        ANDROID_HOME: $HOME/.buildozer/android/platform/android-sdk
        ANDROID_SDK_ROOT: $HOME/.buildozer/android/platform/android-sdk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: HashEncryptor-APK
        path: bin/*.apk
