name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROIDSDK: ${{ github.workspace }}/android-sdk

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # JAVA
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # LINUX DEPENDENCIES
      # ==========================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            autopoint \
            libtool \
            libtool-bin \
            libltdl-dev \
            m4 \
            pkg-config \
            cmake \
            ninja-build \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            liblzma-dev \
            gettext


      # ==========================================
      # RUST
      # ==========================================

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable


      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Install Android command line tools
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$ANDROID_HOME"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O cmdline-tools.zip

          unzip -q cmdline-tools.zip

          mv cmdline-tools cmdline-tools-tmp

          mkdir -p cmdline-tools/latest

          mv cmdline-tools-tmp/* cmdline-tools/latest/

          rm -f cmdline-tools.zip

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          echo
          echo "sdkmanager:"
          command -v sdkmanager

          sdkmanager --version


      # ==========================================
      # ANDROID LICENSES
      # ==========================================

      - name: Accept Android licenses
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses > /dev/null || true


      # ==========================================
      # ANDROID PACKAGES
      # ==========================================

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

          yes | sdkmanager --licenses > /dev/null || true


      # ==========================================
      # LEGACY SDK COMPATIBILITY
      # ==========================================

      - name: Prepare legacy sdkmanager path
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"

          echo "=========================================="
          echo "PREPARING LEGACY SDK PATH"
          echo "=========================================="

          mkdir -p "$SDK/tools/bin"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/avdmanager" \
            "$SDK/tools/bin/avdmanager"

          ln -sf \
            "$SDK/cmdline-tools/latest/bin/apkanalyzer" \
            "$SDK/tools/bin/apkanalyzer"

          echo
          echo "Legacy SDK directory:"
          ls -la "$SDK/tools/bin/"

          echo
          echo "sdkmanager version:"
          "$SDK/tools/bin/sdkmanager" --version


      # ==========================================
      # BUILDOZER
      # ==========================================

      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install buildozer


      # ==========================================
      # CYTHON
      # ==========================================

      - name: Install Cython
        shell: bash
        run: |
          set -e

          python -m pip install "Cython<3"

          echo "Cython:"
          cython --version


      # ==========================================
      # SHOW VERSIONS
      # ==========================================

      - name: Show versions
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERSIONS"
          echo "=========================================="

          echo
          echo "Python:"
          python --version

          echo
          echo "Java:"
          java -version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Cython:"
          cython --version

          echo
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo
          echo "sdkmanager:"
          command -v sdkmanager


      # ==========================================
      # CONFIGURE BUILDOZER SDK
      # ==========================================

      - name: Configure Buildozer SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          ln -s \
            "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "BUILDOZER SDK"
          echo "=========================================="

          echo
          echo "Buildozer platform:"
          ls -la "$HOME/.buildozer/android/platform/"

          echo
          echo "SDK:"
          ls -la "$HOME/.buildozer/android/platform/android-sdk"

          echo
          echo "Legacy sdkmanager:"
          ls -la \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/"


      # ==========================================
      # ENVIRONMENT
      # ==========================================

      - name: Configure environment
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> "$GITHUB_ENV"


      # ==========================================
      # CLEAN PROJECT
      # ==========================================

      - name: Clean project build
        shell: bash
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin

          mkdir -p .buildozer
          mkdir -p bin

          echo "Project build directory cleaned."


      # ==========================================
      # RECREATE SDK LINK
      # ==========================================

      - name: Recreate Buildozer SDK link
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          ln -s \
            "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "=========================================="
          echo "CHECKING BUILDOZER SDK"
          echo "=========================================="

          test -x \
            "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"

          "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager" --version


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build APK
        shell: bash
        env:
          P4A_BUILD_VERSION: master

        run: |
          set +e

          export ANDROID_HOME="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROIDSDK="$ANDROID_HOME"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "=========================================="
          echo "BUILDING APK"
          echo "=========================================="

          echo
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROIDSDK=$ANDROIDSDK"

          echo
          echo "SDK manager:"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

          echo
          echo "Buildozer:"
          buildozer --version

          echo
          echo "Starting Buildozer..."
          echo

          buildozer -v android debug > build.log 2>&1

          BUILD_EXIT_CODE=$?

          echo
          echo "=========================================="
          echo "BUILD EXIT CODE: $BUILD_EXIT_CODE"
          echo "=========================================="

          echo
          echo "=========================================="
          echo "LAST 200 LINES OF BUILD LOG"
          echo "=========================================="

          tail -n 200 build.log

          echo
          echo "=========================================="
          echo "SEARCHING FOR ERRORS"
          echo "=========================================="

          grep -Ein \
            "error:|error |failed|failure|exception|traceback|fatal|undefined reference|command failed" \
            build.log | tail -n 100 || true

          echo
          echo "=========================================="
          echo "END OF ERROR SEARCH"
          echo "=========================================="

          if [ "$BUILD_EXIT_CODE" -ne 0 ]; then

            echo
            echo "=========================================="
            echo "BUILD FAILED"
            echo "=========================================="

            exit "$BUILD_EXIT_CODE"
          fi

          echo
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="


      # ==========================================
      # UPLOAD FULL BUILD LOG
      # ==========================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: build-log
          path: build.log
          if-no-files-found: warn


      # ==========================================
      # LIST APK
      # ==========================================

      - name: List APK
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "APK FILES"
          echo "=========================================="

          find bin \
            -maxdepth 1 \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print 2>/dev/null || true


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4

        with:
          name: hash-encryptor-apk

          path: |
            bin/*.apk
            bin/*.aab

          if-no-files-found: error
