name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # 3. JAVA
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 4. SYSTEM DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            autopoint \
            libtool \
            libtool-bin \
            libltdl-dev \
            m4 \
            pkg-config \
            cmake \
            ninja-build \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            liblzma-dev \
            gettext


      # ==========================================
      # 5. RUST
      # ==========================================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable


      # ==========================================
      # 6. INSTALL ANDROID COMMAND LINE TOOLS
      # ==========================================
      - name: Install Android command line tools
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$ANDROID_HOME"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O cmdline-tools.zip

          unzip -q cmdline-tools.zip

          mv cmdline-tools cmdline-tools-tmp

          mkdir -p cmdline-tools/latest

          mv cmdline-tools-tmp/* cmdline-tools/latest/

          rm -f cmdline-tools.zip

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdkmanager=$(command -v sdkmanager)"

          sdkmanager --version


      # ==========================================
      # 7. ACCEPT ANDROID LICENSES
      # ==========================================
      - name: Accept Android licenses
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses > /dev/null || true


      # ==========================================
      # 8. INSTALL ANDROID SDK PACKAGES
      # ==========================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;25.2.9519653"

          yes | sdkmanager --licenses > /dev/null || true


      # ==========================================
      # 9. VERIFY SDK
      # ==========================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo

          echo "sdkmanager:"
          command -v sdkmanager

          echo

          echo "adb:"
          command -v adb || true

          echo

          echo "Installed SDK:"
          sdkmanager --list_installed || true

          echo

          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk/"


      # ==========================================
      # 10. VERIFY LIBTOOL
      # ==========================================
      - name: Verify libtool environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "LIBTOOL ENVIRONMENT"
          echo "=========================================="

          libtool --version
          autoreconf --version
          automake --version
          autoconf --version

          echo
          echo "Checking LT_SYS_SYMBOL_USCORE..."

          grep -R "LT_SYS_SYMBOL_USCORE" \
            /usr/share/aclocal \
            /usr/share/libtool \
            2>/dev/null | head -20 || true

          echo
          echo "libltdl-dev files:"
          dpkg -L libltdl-dev | head -50


      # ==========================================
      # 11. INSTALL BUILDOZER
      # ==========================================
      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install buildozer


      # ==========================================
      # 12. INSTALL CYTHON
      # ==========================================
      - name: Install Cython
        shell: bash
        run: |
          set -e

          python -m pip install "Cython<3"

          cython --version


      # ==========================================
      # 13. SHOW BUILDOZER VERSION
      # ==========================================
      - name: Show Buildozer version
        shell: bash
        run: |
          set -e

          buildozer --version


      # ==========================================
      # 14. CONFIGURE BUILDOZER SDK
      # ==========================================
      - name: Configure Buildozer Android SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          ln -s \
            "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer SDK link:"
          ls -la "$HOME/.buildozer/android/platform/"

          echo

          echo "SDK through Buildozer:"
          ls -la \
            "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/"


      # ==========================================
      # 15. CONFIGURE NDK
      # ==========================================
      - name: Configure Android NDK
        shell: bash
        run: |
          set -e

          export ANDROID_NDK="$ANDROID_HOME/ndk/25.2.9519653"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/25.2.9519653"

          echo "ANDROID_NDK=$ANDROID_NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=$ANDROID_NDK"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"


      # ==========================================
      # 16. CLEAN BUILDOZER
      # ==========================================
      - name: Clean Buildozer
        shell: bash
        run: |
          set -e

          rm -rf .buildozer
          rm -rf bin

          rm -rf "$HOME/.buildozer/android/platform/build"

          mkdir -p "$HOME/.buildozer/android/platform"

          ln -s \
            "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "Clean complete"


      # ==========================================
      # 17. VERIFY PYTHON
      # ==========================================
      - name: Verify Python environment
        shell: bash
        run: |
          set -e

          echo "Python:"
          python --version

          echo

          echo "Pip:"
          python -m pip --version

          echo

          echo "Cython:"
          cython --version

          echo

          echo "Buildozer:"
          buildozer --version


      # ==========================================
      # 18. FINAL BUILD ENVIRONMENT
      # ==========================================
      - name: Show build configuration
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "=========================================="
          echo "FINAL BUILD ENVIRONMENT"
          echo "=========================================="

          echo "Python:"
          python --version

          echo

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo

          echo "Android NDK:"
          echo "$ANDROID_NDK"

          echo

          echo "sdkmanager:"
          command -v sdkmanager

          echo

          echo "Buildozer:"
          buildozer --version

          echo

          echo "Cython:"
          cython --version

          echo

          echo "Java:"
          java -version

          echo

          echo "=========================================="


      # ==========================================
      # 19. BUILD APK
      # ==========================================
      - name: Build APK
        shell: bash
        env:
          P4A_BUILD_VERSION: master
        run: |
          set -e

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          export ANDROID_HOME="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          export ANDROID_NDK="$ANDROID_HOME/ndk/25.2.9519653"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/25.2.9519653"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/25.2.9519653"

          echo "=========================================="
          echo "BUILDING APK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK=$ANDROID_NDK"

          echo

          buildozer -v android debug


      # ==========================================
      # 20. LIST APK
      # ==========================================
      - name: List APK
        if: always()
        shell: bash
        run: |
          echo "APK files:"

          find bin \
            -maxdepth 1 \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print 2>/dev/null || true


      # ==========================================
      # 21. UPLOAD APK
      # ==========================================
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hash-encryptor-apk
          path: |
            bin/*.apk
            bin/*.aab
          if-no-files-found: error
