name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Accept Android SDK licenses
      run: |
        # Автоматически принимаем ВСЕ лицензии Android SDK
        yes | sdkmanager --licenses || true
      env:
        ANDROID_HOME: /usr/lib/android-sdk
        ANDROID_SDK_ROOT: /usr/lib/android-sdk

    - name: Build APK with Buildozer
      run: buildozer android debug
      env:
        ANDROID_HOME: /usr/lib/android-sdk
        ANDROID_SDK_ROOT: /usr/lib/android-sdk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: HashEncryptor-APK
        path: bin/*.apk
