name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools

          mkdir -p "$HOME/android-sdk/cmdline-tools/latest"

          cp -r /tmp/cmdline-tools/cmdline-tools/* \
            "$HOME/android-sdk/cmdline-tools/latest/"

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer
          pip install "cython==0.29.34"

      - name: Prepare Buildozer Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          ln -s \
            "$HOME/android-sdk" \
            "$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p \
            "$HOME/android-sdk/tools/bin"

          ln -sf \
            "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
            "$HOME/android-sdk/tools/bin/sdkmanager"

          ln -sf \
            "$HOME/android-sdk/cmdline-tools/latest/bin/avdmanager" \
            "$HOME/android-sdk/tools/bin/avdmanager"

          echo "SDK structure:"
          ls -la "$HOME/.buildozer/android/platform/android-sdk/tools/bin"

          echo "sdkmanager:"
          "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager" --version

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HashEncryptor-APK
          path: bin/*.apk
