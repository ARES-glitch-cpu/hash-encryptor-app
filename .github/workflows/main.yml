name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

  ANDROID_API: "33"
  ANDROID_MIN_API: "21"
  ANDROID_NDK_VERSION: "25.2.9519653"

  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

  BUILDOZER_WARN_ON_ROOT: "0"

  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Python 3.11
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------
      # 3. Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 4. Linux dependencies
      # ---------------------------------------------------------
      - name: Install Linux dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            gettext \
            patch \
            ccache \
            rsync

      # ---------------------------------------------------------
      # 5. Rust
      # ---------------------------------------------------------
      - name: Install Rust
        run: |
          set -eux

          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf \
              https://sh.rustup.rs \
              | sh -s -- -y
          fi

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          source "$HOME/.cargo/env"

          rustc --version
          cargo --version

      # ---------------------------------------------------------
      # 6. Android SDK command line tools
      # ---------------------------------------------------------
      - name: Install Android SDK command line tools
        run: |
          set -eux

          SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          cd "$RUNNER_TEMP"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip

          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          cp -r cmdline-tools/* \
            "$SDK_ROOT/cmdline-tools/latest/"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"

          sdkmanager --version

      # ---------------------------------------------------------
      # 7. Android SDK
      # ---------------------------------------------------------
      - name: Install Android SDK packages
        run: |
          set -eux

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

          yes | sdkmanager --licenses >/dev/null || true

      # ---------------------------------------------------------
      # 8. Android NDK r25b
      # ---------------------------------------------------------
      - name: Install Android NDK r25b
        run: |
          set -eux

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          sdkmanager "ndk;${ANDROID_NDK_VERSION}"

          yes | sdkmanager --licenses >/dev/null || true

          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

          echo "NDK installed:"
          ls -la "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

      # ---------------------------------------------------------
      # 9. Android environment
      # ---------------------------------------------------------
      - name: Configure Android environment
        run: |
          set -eux

          NDK_PATH="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROIDNDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=${ANDROID_API}" >> "$GITHUB_ENV"
          echo "NDKAPI=${ANDROID_MIN_API}" >> "$GITHUB_ENV"

          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$NDK_PATH:$HOME/.cargo/bin:$PATH" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 10. Проверка Android environment
      # ---------------------------------------------------------
      - name: Verify Android environment
        run: |
          set -eux

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$HOME/.cargo/bin:$PATH"

          echo "===== JAVA ====="
          java -version

          echo "===== PYTHON ====="
          python --version

          echo "===== SDKMANAGER ====="
          sdkmanager --version

          echo "===== ANDROID HOME ====="
          echo "$ANDROID_HOME"

          echo "===== NDK ====="
          echo "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API}"
          test -d "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"

      # ---------------------------------------------------------
      # 11. Buildozer
      # ---------------------------------------------------------
      - name: Install Buildozer
        run: |
          set -eux

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "cython<3" \
            legacy-cgi

          python -m pip install \
            git+https://github.com/kivy/buildozer.git

          buildozer --version

      # ---------------------------------------------------------
      # 12. Показать buildozer.spec
      # ---------------------------------------------------------
      - name: Show build configuration
        run: |
          set -eux

          echo "===== buildozer.spec ====="
          cat buildozer.spec

      # ---------------------------------------------------------
      # 13. Совместимость Buildozer со старым SDK layout
      # ---------------------------------------------------------
      - name: Configure Buildozer SDK compatibility
        run: |
          set -eux

          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$BUILDOZER_SDK"

          ln -s "$ANDROID_HOME" "$BUILDOZER_SDK"

          mkdir -p "$ANDROID_HOME/tools"

          if [ ! -e "$ANDROID_HOME/tools/bin" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/latest/bin" \
              "$ANDROID_HOME/tools/bin"
          fi

          echo "===== SDK ====="
          ls -la "$ANDROID_HOME"

          echo "===== tools ====="
          ls -la "$ANDROID_HOME/tools"

          echo "===== sdkmanager ====="
          ls -la "$ANDROID_HOME/tools/bin/sdkmanager"

      # ---------------------------------------------------------
      # 14. Очистка старых сборок
      # ---------------------------------------------------------
      - name: Clean previous Buildozer state
        run: |
          set -eux

          rm -rf .buildozer
          rm -rf bin

          mkdir -p .buildozer

      # ---------------------------------------------------------
      # 15. Сборка APK
      # ---------------------------------------------------------
      - name: Build Android APK
        env:
          P4A_BUILD_VERSION: "develop"
        run: |
          set -eux

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$HOME/.cargo/bin:$PATH"

          export ANDROID_HOME="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROIDNDK="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          export ANDROIDAPI="${ANDROID_API}"
          export NDKAPI="${ANDROID_MIN_API}"

          echo "===== FINAL ENVIRONMENT ====="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDNDK=$ANDROIDNDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "NDKAPI=$NDKAPI"

          echo "===== NDK VERSION ====="

          "$ANDROIDNDK/ndk-build" --version || true

          echo "===== BUILD ====="

          buildozer -v android debug

      # ---------------------------------------------------------
      # 16. Поиск APK
      # ---------------------------------------------------------
      - name: Show APK files
        if: always()
        run: |
          echo "===== APK FILES ====="

          find . -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print \
            -exec ls -lh {} \;

      # ---------------------------------------------------------
      # 17. Загрузка APK
      # ---------------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hash-Encryptor-APK
          path: |
            bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # 18. Логи при ошибке
      # ---------------------------------------------------------
      - name: Upload Buildozer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Buildozer-debug-logs
          path: |
            .buildozer/
          if-no-files-found: ignore
          retention-days: 7
