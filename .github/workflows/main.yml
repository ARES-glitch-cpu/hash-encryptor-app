name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip wget autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

    - name: Setup Android SDK and Workaround Buildozer Bug
      run: |
        # 1. Создаем папку SDK
        export ANDROID_HOME=/usr/local/lib/android/sdk
        mkdir -p $ANDROID_HOME
        
        # 2. Скачиваем современные command line tools
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $ANDROID_HOME
        
        # 3. Перемещаем их в папку 'latest', как того требует новый sdkmanager
        mkdir -p $ANDROID_HOME/cmdline-tools/latest
        mv $ANDROID_HOME/cmdline-tools/bin $ANDROID_HOME/cmdline-tools/latest/
        mv $ANDROID_HOME/cmdline-tools/lib $ANDROID_HOME/cmdline-tools/latest/
        mv $ANDROID_HOME/cmdline-tools/NOTICE.txt $ANDROID_HOME/cmdline-tools/latest/
        mv $ANDROID_HOME/cmdline-tools/source.properties $ANDROID_HOME/cmdline-tools/latest/
        rm cmdline-tools.zip
        
        # 4. ГЛАВНЫЙ ТРЮК: Создаем "обманку" для Buildozer. 
        # Buildozer ищет старый путь tools/bin/sdkmanager. Мы создаем скрипт, 
        # который перенаправляет этот вызов на новый путь.
        mkdir -p $ANDROID_HOME/tools/bin
        echo '#!/bin/bash' > $ANDROID_HOME/tools/bin/sdkmanager
        echo '/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@"' >> $ANDROID_HOME/tools/bin/sdkmanager
        chmod +x $ANDROID_HOME/tools/bin/sdkmanager
        
        # 5. Принимаем все лицензии
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # 6. Предварительно устанавливаем базовые пакеты, чтобы Buildozer не пытался качать их сам
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0"

    - name: Build APK with Buildozer
      run: buildozer android debug
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: HashEncryptor-APK
        path: bin/*.apk
