name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      # --------------------------------------------------
      # 1. Получаем исходники
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 3. Java
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 4. Системные зависимости
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            libffi-dev \
            libssl-dev \
            liblzma-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build

      # --------------------------------------------------
      # 5. Rust
      # --------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # --------------------------------------------------
      # 6. Android SDK
      # --------------------------------------------------
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$ANDROID_HOME"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip -d cmdline-tools

          mv cmdline-tools/cmdline-tools cmdline-tools/latest

          rm commandlinetools.zip

          echo "Android SDK installed:"
          find "$ANDROID_HOME" -maxdepth 2 -type d | sort

      # --------------------------------------------------
      # 7. Переменные Android
      # --------------------------------------------------
      - name: Configure Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      # --------------------------------------------------
      # 8. Проверяем настоящий sdkmanager
      # --------------------------------------------------
      - name: Check Android SDK manager
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      # --------------------------------------------------
      # 9. Принимаем лицензии Android
      # --------------------------------------------------
      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # --------------------------------------------------
      # 10. Устанавливаем Android SDK компоненты
      # --------------------------------------------------
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;25.2.9519653"

      # --------------------------------------------------
      # 11. Проверяем SDK
      # --------------------------------------------------
      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo
          echo "Platforms:"
          ls -la "$ANDROID_HOME/platforms"
          echo
          echo "Build tools:"
          ls -la "$ANDROID_HOME/build-tools"
          echo
          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk"

      # --------------------------------------------------
      # 12. Устанавливаем Buildozer
      # --------------------------------------------------
      - name: Install Buildozer
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer

      # --------------------------------------------------
      # 13. Устанавливаем Cython
      # --------------------------------------------------
      - name: Install Cython
        shell: bash
        run: |
          python -m pip install "Cython<3"

      # --------------------------------------------------
      # 14. Подготавливаем структуру SDK для Buildozer
      #
      # ВАЖНО:
      # Здесь НЕ создаём symlink sdkmanager.
      #
      # Buildozer старых версий ожидает:
      # tools/bin/sdkmanager
      #
      # Поэтому создаём маленький wrapper,
      # который запускает настоящий современный sdkmanager.
      # --------------------------------------------------
      - name: Prepare Buildozer SDK compatibility
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_HOME/tools/bin"

          cat > "$ANDROID_HOME/tools/bin/sdkmanager" <<EOF
          #!/bin/bash
          exec "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "\$@"
          EOF

          chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"

          echo "Compatibility sdkmanager:"
          cat "$ANDROID_HOME/tools/bin/sdkmanager"

          echo
          echo "Testing compatibility sdkmanager:"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version

      # --------------------------------------------------
      # 15. Настраиваем Buildozer
      # --------------------------------------------------
      - name: Prepare Buildozer directories
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          ln -s \
            "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer SDK:"
          ls -la "$HOME/.buildozer/android/platform/"

          echo
          echo "SDK path:"
          readlink -f "$HOME/.buildozer/android/platform/android-sdk"

      # --------------------------------------------------
      # 16. Очистка старой сборки
      # --------------------------------------------------
      - name: Clean Buildozer
        shell: bash
        run: |
          buildozer android clean || true
          rm -rf .buildozer

      # --------------------------------------------------
      # 17. Создаём SDK ссылку снова после очистки
      # --------------------------------------------------
      - name: Restore Buildozer SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          ln -s \
            "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer SDK:"
          readlink -f "$HOME/.buildozer/android/platform/android-sdk"

          echo
          echo "Testing sdkmanager through Buildozer path:"

          "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager" --version

      # --------------------------------------------------
      # 18. Сборка APK
      # --------------------------------------------------
      - name: Build APK
        shell: bash
        run: |
          set -e

          buildozer -v android debug

      # --------------------------------------------------
      # 19. Показываем APK
      # --------------------------------------------------
      - name: List APK files
        shell: bash
        run: |
          find bin -type f -name "*.apk" -print

      # --------------------------------------------------
      # 20. Загружаем APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hash-encryptor-apk
          path: bin/*.apk
          if-no-files-found: error
