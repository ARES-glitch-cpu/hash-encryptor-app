name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:

      # ================================================
      # 1. Исходники
      # ================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ================================================
      # 2. Python
      # ================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ================================================
      # 3. Java 17
      # ================================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ================================================
      # 4. Системные зависимости
      # ================================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            build-essential \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            m4 \
            pkg-config \
            cmake \
            ninja-build \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            liblzma-dev \
            gettext \
            autopoint


      # ================================================
      # 5. Rust
      # ================================================

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable


      # ================================================
      # 6. Android command line tools
      # ================================================

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$ANDROID_HOME"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip -d cmdline-tools

          mv cmdline-tools/cmdline-tools cmdline-tools/latest

          rm commandlinetools.zip


      # ================================================
      # 7. Android environment
      # ================================================

      - name: Configure Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"


      # ================================================
      # 8. Проверка sdkmanager
      # ================================================

      - name: Check sdkmanager
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version


      # ================================================
      # 9. Android licenses
      # ================================================

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true


      # ================================================
      # 10. Android SDK packages
      # ================================================

      - name: Install Android packages
        shell: bash
        run: |
          set -e

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;25.2.9519653"


      # ================================================
      # 11. Проверяем установленный NDK
      # ================================================

      - name: Check Android NDK
        shell: bash
        run: |
          set -e

          echo "Installed NDK:"
          ls -la "$ANDROID_HOME/ndk"

          echo
          echo "NDK version:"
          cat "$ANDROID_HOME/ndk/25.2.9519653/source.properties"


      # ================================================
      # 12. Устанавливаем Buildozer
      # ================================================

      - name: Install Buildozer
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer


      # ================================================
      # 13. Cython
      # ================================================

      - name: Install Cython
        shell: bash
        run: |
          python -m pip install "Cython<3"


      # ================================================
      # 14. Buildozer SDK compatibility
      # ================================================

      - name: Prepare Buildozer SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_HOME/tools/bin"

          cat > "$ANDROID_HOME/tools/bin/sdkmanager" <<EOF
          #!/bin/bash
          exec "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "\$@"
          EOF

          chmod +x "$ANDROID_HOME/tools/bin/sdkmanager"

          echo "Testing sdkmanager:"
          "$ANDROID_HOME/tools/bin/sdkmanager" --version


      # ================================================
      # 15. Buildozer directories
      # ================================================

      - name: Prepare Buildozer
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          ln -s \
            "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer Android SDK:"
          readlink -f \
            "$HOME/.buildozer/android/platform/android-sdk"


      # ================================================
      # 16. Чистим старые файлы
      # ================================================

      - name: Clean Buildozer
        shell: bash
        run: |
          rm -rf .buildozer
          rm -rf bin


      # ================================================
      # 17. Восстанавливаем ссылку после очистки
      # ================================================

      - name: Restore Buildozer SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          ln -s \
            "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "SDK:"
          readlink -f \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo
          echo "sdkmanager:"
          "$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager" --version


      # ================================================
      # 18. Настраиваем NDK
      # ================================================

      - name: Configure NDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_NDK=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"


      # ================================================
      # 19. Build APK
      # ================================================

      - name: Build APK
        shell: bash
        run: |
          set -e

          buildozer -v android debug


      # ================================================
      # 20. Показываем APK
      # ================================================

      - name: List APK
        shell: bash
        run: |
          find bin -type f -name "*.apk" -print


      # ================================================
      # 21. Загружаем APK
      # ================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hash-encryptor-apk
          path: bin/*.apk
          if-no-files-found: error
